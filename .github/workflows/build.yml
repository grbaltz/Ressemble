name: Build standalone app

# PyInstaller can't cross-compile -- each platform's build has to actually
# run on that platform, hence the matrix below rather than a single job.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Ressemble-windows
          - os: ubuntu-latest
            artifact_name: Ressemble-linux
          - os: macos-latest # Apple Silicon (arm64) -- covers every Mac since ~2020.
            artifact_name: Ressemble-macos-arm64
            # macos-13 (Intel) dropped: its hosted runners have been getting stuck
            # permanently "queued" on GitHub's side, which blocked the release
            # job (needs: build) from ever firing for *any* platform.

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller packaging/ressemble.spec --noconfirm --clean --distpath dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Ressemble/* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact_name }}.zip Ressemble

      - name: Re-sign bundle (macOS)
        if: runner.os == 'macOS'
        # python.org's official macOS Python (what actions/setup-python uses)
        # ships its compiled stdlib extensions pre-signed with Apple's own
        # Developer ID. Once PyInstaller repackages them into a new, unsigned
        # .app, macOS library validation can refuse to load a nested binary
        # whose signature identity doesn't match the host app's -- Python's
        # import machinery then just reports it as "module not found" (seen
        # in practice: _struct failing despite the .so being present in the
        # bundle). An ad-hoc deep re-sign gives every nested binary a
        # consistent identity and doesn't require a paid Developer ID.
        run: codesign --force --deep --sign - dist/Ressemble.app

      - name: Diagnose struct extension (macOS)
        if: runner.os == 'macOS'
        # Temporary: the last two fix attempts (raw lib-dynload copy, then
        # hiddenimports) both failed to resolve "_struct" at runtime on a
        # real Mac, so instead of guessing a third time, capture ground
        # truth from this runner (a real Mac) directly: whether _struct is
        # even a dynamic extension for this Python build, what actually
        # landed in the bundle, and the real dyld-level failure when the
        # frozen binary is launched exactly like the user launches it.
        run: |
          echo "--- is _struct a builtin or a dynamic extension for this interpreter? ---"
          python3 -c "import sys; print('builtin:', '_struct' in sys.builtin_module_names)"
          python3 -c "import _struct; print('file:', getattr(_struct, '__file__', '<no __file__ -- builtin>'))"
          echo "--- files matching *struct* in the frozen bundle ---"
          find dist/Ressemble.app -iname '*struct*' -exec ls -la {} \;
          echo "--- codesign identity on main binary ---"
          codesign -dvvv dist/Ressemble.app/Contents/MacOS/Ressemble 2>&1 || true
          echo "--- direct launch, traced, exactly as run from Terminal ---"
          # No `timeout` binary on macOS runners by default -- background it,
          # kill it after 10s if it's still alive (this is a GUI app, so if
          # struct actually loads it'll sit in its event loop instead of
          # crashing, and we don't want that to hang the job).
          # `run:` steps execute under `bash -e`; if the app crashes, `wait`
          # returns its real exit status and set -e would abort before the
          # trailing `tail` ever prints the log. Disable it for this block.
          set +e
          DYLD_PRINT_LIBRARIES=1 DYLD_PRINT_LIBRARIES_POST_LAUNCH=1 dist/Ressemble.app/Contents/MacOS/Ressemble > /tmp/launch.log 2>&1 &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            echo "(still running after 10s -- app launched without crashing; killing)"
            kill -9 "$pid" 2>/dev/null || true
          else
            wait "$pid"
            echo "(exited with code $?)"
          fi
          tail -200 /tmp/launch.log

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # `ditto -c -k --keepParent` was flattening Ressemble.app instead of
        # keeping it as a single top-level entry. shutil.make_archive with
        # root_dir/base_dir is guaranteed to nest everything under
        # Ressemble.app/ -- verified locally against a mock .app tree since
        # there's no Mac available to test the real ditto invocation on.
        run: python3 -c "import shutil; shutil.make_archive('${{ matrix.artifact_name }}', 'zip', root_dir='dist', base_dir='Ressemble.app')"

      - name: Diagnose post-zip bundle integrity (macOS)
        if: runner.os == 'macOS'
        # The pre-zip app launches fine (see the diagnostic step above), so
        # if the user's downloaded copy still fails, the zip round-trip
        # itself -- shutil.make_archive, which uses zipfile and does NOT
        # preserve symlinks (it dereferences them into plain files) -- is
        # the prime suspect. PySide6/Qt ship real .framework bundles full of
        # the Versions/Current symlink pattern; dereferencing those would
        # change the on-disk bytes/layout of everything nested under them
        # relative to what was code-signed, which macOS's mandatory
        # code-signing enforcement (unconditional on Apple Silicon) would
        # then refuse to load. Re-extract the exact artifact zip into a
        # fresh directory and re-run the same checks against that copy.
        run: |
          echo "--- verifying pre-zip bundle (should pass) ---"
          codesign --verify --deep --strict --verbose=4 dist/Ressemble.app 2>&1 || true
          echo "--- unzipping the actual artifact into a fresh dir ---"
          mkdir -p /tmp/extracted
          unzip -q "${{ matrix.artifact_name }}.zip" -d /tmp/extracted
          echo "--- symlink count: pre-zip vs post-unzip ---"
          echo "pre-zip:  $(find dist/Ressemble.app -type l | wc -l)"
          echo "post-zip: $(find /tmp/extracted/Ressemble.app -type l | wc -l)"
          echo "--- verifying post-zip bundle ---"
          codesign --verify --deep --strict --verbose=4 /tmp/extracted/Ressemble.app 2>&1 || true
          echo "--- launching the post-zip copy, traced ---"
          # `run:` steps execute under `bash -e`, and `wait` returns the
          # child's real exit status -- if the app crashed (which is exactly
          # what we're trying to observe), `set -e` aborts the script right
          # there and we never reach `tail`. Disable it for this block.
          set +e
          DYLD_PRINT_LIBRARIES=1 DYLD_PRINT_LIBRARIES_POST_LAUNCH=1 /tmp/extracted/Ressemble.app/Contents/MacOS/Ressemble > /tmp/launch2.log 2>&1 &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            echo "(still running after 10s -- launched without crashing; killing)"
            kill -9 "$pid" 2>/dev/null || true
          else
            wait "$pid"
            echo "(exited with code $?)"
          fi
          tail -200 /tmp/launch2.log

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
