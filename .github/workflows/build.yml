name: Build standalone app

# PyInstaller can't cross-compile -- each platform's build has to actually
# run on that platform, hence the matrix below rather than a single job.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Ressemble-windows
          - os: ubuntu-latest
            artifact_name: Ressemble-linux
          - os: macos-latest # Apple Silicon (arm64) -- covers every Mac since ~2020.
            artifact_name: Ressemble-macos-arm64
            # macos-13 (Intel) dropped: its hosted runners have been getting stuck
            # permanently "queued" on GitHub's side, which blocked the release
            # job (needs: build) from ever firing for *any* platform.

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller packaging/ressemble.spec --noconfirm --clean --distpath dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Ressemble/* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact_name }}.zip Ressemble

      - name: Re-sign bundle (macOS)
        if: runner.os == 'macOS'
        # python.org's official macOS Python (what actions/setup-python uses)
        # ships its compiled stdlib extensions pre-signed with Apple's own
        # Developer ID. Once PyInstaller repackages them into a new, unsigned
        # .app, macOS library validation can refuse to load a nested binary
        # whose signature identity doesn't match the host app's -- Python's
        # import machinery then just reports it as "module not found" (seen
        # in practice: _struct failing despite the .so being present in the
        # bundle). An ad-hoc deep re-sign gives every nested binary a
        # consistent identity and doesn't require a paid Developer ID.
        run: codesign --force --deep --sign - dist/Ressemble.app

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # shutil.make_archive's 'zip' format (zipfile/os.walk under the
        # hood) does not preserve symlinks -- confirmed on a real Mac via a
        # temporary CI diagnostic: it took the bundle from 1994 symlinks to
        # 0, which broke Qt's .framework layout and PyInstaller's own
        # Contents/MacOS <-> Contents/Frameworks symlink structure,
        # surfacing as "_struct" failing to load at runtime even though the
        # pre-zip build was always fine. ditto is Apple's own archiving
        # tool and preserves symlinks, resource forks, and code signatures
        # correctly; running it from inside
        # dist/ (rather than passing "dist/Ressemble.app") keeps the
        # recorded path as just "Ressemble.app", which is what --keepParent
        # needs to nest it as a single top-level entry instead of double
        # nesting under "dist/".
        run: |
          cd dist
          ditto -c -k --keepParent Ressemble.app "../${{ matrix.artifact_name }}.zip"
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
