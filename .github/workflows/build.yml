name: Build standalone app

# PyInstaller can't cross-compile -- each platform's build has to actually
# run on that platform, hence the matrix below rather than a single job.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Ressemble-windows
          - os: ubuntu-latest
            artifact_name: Ressemble-linux
          - os: macos-latest # Apple Silicon (arm64) -- covers every Mac since ~2020.
            artifact_name: Ressemble-macos-arm64
            # macos-13 (Intel) dropped: its hosted runners have been getting stuck
            # permanently "queued" on GitHub's side, which blocked the release
            # job (needs: build) from ever firing for *any* platform.

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller packaging/ressemble.spec --noconfirm --clean --distpath dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Ressemble/* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact_name }}.zip Ressemble

      - name: Re-sign bundle (macOS)
        if: runner.os == 'macOS'
        # python.org's official macOS Python (what actions/setup-python uses)
        # ships its compiled stdlib extensions pre-signed with Apple's own
        # Developer ID. Once PyInstaller repackages them into a new, unsigned
        # .app, macOS library validation can refuse to load a nested binary
        # whose signature identity doesn't match the host app's -- Python's
        # import machinery then just reports it as "module not found" (seen
        # in practice: _struct failing despite the .so being present in the
        # bundle). An ad-hoc deep re-sign gives every nested binary a
        # consistent identity and doesn't require a paid Developer ID.
        run: codesign --force --deep --sign - dist/Ressemble.app

      - name: Diagnose struct extension (macOS)
        if: runner.os == 'macOS'
        # Temporary: the last two fix attempts (raw lib-dynload copy, then
        # hiddenimports) both failed to resolve "_struct" at runtime on a
        # real Mac, so instead of guessing a third time, capture ground
        # truth from this runner (a real Mac) directly: whether _struct is
        # even a dynamic extension for this Python build, what actually
        # landed in the bundle, and the real dyld-level failure when the
        # frozen binary is launched exactly like the user launches it.
        run: |
          echo "--- is _struct a builtin or a dynamic extension for this interpreter? ---"
          python3 -c "import sys; print('builtin:', '_struct' in sys.builtin_module_names)"
          python3 -c "import _struct; print('file:', getattr(_struct, '__file__', '<no __file__ -- builtin>'))"
          echo "--- files matching *struct* in the frozen bundle ---"
          find dist/Ressemble.app -iname '*struct*' -exec ls -la {} \;
          echo "--- codesign identity on main binary ---"
          codesign -dvvv dist/Ressemble.app/Contents/MacOS/Ressemble 2>&1 || true
          echo "--- direct launch, traced, exactly as run from Terminal ---"
          DYLD_PRINT_LIBRARIES=1 DYLD_PRINT_LIBRARIES_POST_LAUNCH=1 dist/Ressemble.app/Contents/MacOS/Ressemble 2>&1 | tail -200 || true

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # `ditto -c -k --keepParent` was flattening Ressemble.app instead of
        # keeping it as a single top-level entry. shutil.make_archive with
        # root_dir/base_dir is guaranteed to nest everything under
        # Ressemble.app/ -- verified locally against a mock .app tree since
        # there's no Mac available to test the real ditto invocation on.
        run: python3 -c "import shutil; shutil.make_archive('${{ matrix.artifact_name }}', 'zip', root_dir='dist', base_dir='Ressemble.app')"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
